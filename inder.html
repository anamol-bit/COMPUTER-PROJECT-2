<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Final Project</title>
</head>
<body>

    <!-- 1. TEXT (Copy your text.html content here) -->
    <h1>📝 Text Content</h1>
    <!-- 👇 PASTE YOUR TEXT FROM text.html RIGHT HERE 👇 -->
    <p>This is where your text from text.html goes.</p>
    
    <hr>

    <!-- 2. AUDIO (Copy your audio.html content here) -->
    <h1>🎵 Audio Player</h1>
    <!-- 👇 PASTE YOUR AUDIO TAG FROM audio.html RIGHT HERE 👇 -->
    <audio controls>
        <source src="your-audio.mp3" type="audio/mpeg">
        <source src="your-audio.ogg" type="audio/ogg">
    </audio>

    <hr>

    <!-- 3. VIDEO (Copy your video.html content here) -->
    <h1>🎬 Video Player</h1>
    <!-- 👇 PASTE YOUR VIDEO TAG FROM video.html RIGHT HERE 👇 -->
    <video controls width="600">
        <source src="your-video.mp4" type="video/mp4">
        <source src="your-video.webm" type="video/webm">
    </video>

    <hr>

    <!-- 4. IMAGE (Copy your image.html content here) -->
    <h1>🖼️ Image</h1>
    <!-- 👇 PASTE YOUR IMAGE FROM image.html RIGHT HERE 👇 -->
    <img src="your-image.png" alt="My Image" width="400">

    <hr>

    <!-- 5. REQUIRED: <object> (PDF or document) -->
    <h1>📄 External Document (using &lt;object&gt;)</h1>
    <object data="document.pdf" type="application/pdf" width="600" height="400">
        <a href="document.pdf">Download PDF</a>
    </object>

    <hr>

    <!-- 6. REQUIRED: <embed> (Media/Graphics) -->
    <h1>🎨 Embedded Media (using &lt;embed&gt;)</h1>
    <embed src="your-image.png" type="image/png" width="400" height="300">

    <hr>

    <!-- 7. REQUIRED: <iframe> (External Webpage) -->
    <h1>🌐 External Website (using &lt;iframe&gt;)</h1>
    <iframe src="https://example.com" width="600" height="300" title="External Page"></iframe>

</body>
</html>
